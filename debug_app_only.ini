// debug_app_only.ini
// Usage: Keil → Debug → Init File → point to this file
// This script loads the app and starts it from 0x08100000
// WITHOUT needing the bootloader at 0x08000000.

FUNC void Setup (void) {
    // Read SP and Reset_Handler from app vector table
    SP = _RDWORD(0x08100000);
    PC = _RDWORD(0x08100004);
}

// Load the application
LOAD %L INCREMENTAL

// Set up SP/PC to the app's reset vector
Setup()

// Run to main
g, main
